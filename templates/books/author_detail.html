{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto px-6 py-8">
  <h1 class="text-3xl font-bold mb-4">{{ author.name }}</h1>
  {% if author.bio %}
  <p class="mb-6 whitespace-pre-line">{{ author.bio }}</p>
  {% endif %}

  <h2 class="text-2xl font-semibold mb-4">
    Books by {{ author.name }}
  </h2>
  <div class="grid grid-cols-4 gap-6">
    {% for book in books %}
    <div class="bg-white shadow rounded overflow-hidden hover:shadow-lg transition-shadow">
      <a href="{% url 'books:detail' book.pk %}">
        <img src="{{ book.image_cover.url }}" alt="{{ book.title }}"
             class="w-full h-40 object-cover">
      </a>
      <div class="p-4">
        <h3 class="text-lg font-medium">{{ book.title }}</h3>
      </div>
    </div>
    {% empty %}
    <p>No books found for this author.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
